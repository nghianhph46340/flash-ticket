spring:
  application:
    name: ticketing-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flashticket_db}
    username: ${DB_USER:ticket_admin}
    password: ${DB_PASSWORD:secure_password_123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

# Cấu hình NATS JetStream
nats:
  url: ${NATS_URL:nats://localhost:4222}
  stream:
    name: TICKETS
    subject: tickets.*

server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: 500
      min-spare: 50
    max-connections: 10000
    accept-count: 1000

logging:
  level:
    root: INFO
    com.ticket: INFO
    org.flywaydb: INFO
