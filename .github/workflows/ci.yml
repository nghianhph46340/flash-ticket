name: FlashTicket CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Ports on Runner & Start Test Infrastructure
        run: |
          sudo systemctl stop postgresql || true
          sudo systemctl stop redis-server || true
          docker compose up -d postgres redis nats
          echo "Waiting for PostgreSQL to be ready..."
          until docker compose exec -T postgres pg_isready -U ticket_admin -d flashticket_db; do
            sleep 1
          done
          echo "Services are healthy and ready!"

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Tests
        run: |
          cd ticketing-service
          chmod +x mvnw
          ./mvnw test -B

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Build Frontend
        run: |
          cd ticketing-frontend
          pnpm install --frozen-lockfile
          pnpm run build

  graalvm-native-build:
    name: GraalVM Native Image Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up GraalVM JDK 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Build Native Binary (AOT Compilation)
        run: |
          cd ticketing-service
          chmod +x mvnw
          ./mvnw -Pnative native:compile -DskipTests -B

      - name: Verify Binary Output
        run: |
          ls -la ticketing-service/target/ticketing-service
          file ticketing-service/target/ticketing-service
