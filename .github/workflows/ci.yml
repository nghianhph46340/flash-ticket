name: FlashTicket CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Ports on Runner & Start Test Infrastructure
        run: |
          sudo systemctl stop postgresql || true
          sudo systemctl stop redis-server || true
          docker run -d --name test-postgres -p 5432:5432 -e POSTGRES_DB=flashticket_db -e POSTGRES_USER=ticket_admin -e POSTGRES_PASSWORD=secure_password_123 postgres:16-alpine
          docker run -d --name test-redis -p 6379:6379 redis:7.2-alpine
          docker run -d --name test-nats -p 4222:4222 -p 8222:8222 nats:latest -js
          echo "Waiting for PostgreSQL to be ready..."
          until docker exec test-postgres pg_isready -U ticket_admin -d flashticket_db; do
            sleep 1
          done
          echo "All test containers are healthy and running!"

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Tests
        env:
          DB_HOST: "127.0.0.1"
          REDIS_HOST: "127.0.0.1"
          NATS_URL: "nats://127.0.0.1:4222"
        run: |
          cd ticketing-service
          chmod +x mvnw
          ./mvnw test -B

      - name: Report Test Results on Failure
        if: failure()
        run: |
          REPORTS=$(find ticketing-service/target/surefire-reports -type f -name "*.txt" -exec cat {} + | head -c 50000 || echo "No reports found")
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$REPORTS"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Build Frontend
        run: |
          cd ticketing-frontend
          pnpm install --frozen-lockfile
          pnpm run build

  graalvm-native-build:
    name: GraalVM Native Image Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up GraalVM JDK 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Build Native Binary (AOT Compilation)
        run: |
          cd ticketing-service
          chmod +x mvnw
          ./mvnw -Pnative native:compile -DskipTests -B

      - name: Verify Binary Output
        run: |
          ls -la ticketing-service/target/ticketing-service
          file ticketing-service/target/ticketing-service
